<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Rubik:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: Smart Flashes look. Rainbow-ring logo header, white rounded cards, pill controls; one step at a time. Light theme only, like the original site. */
:root{
  --red:#ff4757;--orange:#ffa502;--yellow:#eccc68;--green:#2ed573;--blue:#1e90ff;--purple:#9c27b0;--teal:#00d2d3;
  --paper:#f8f9fa;--sheet:#ffffff;--ink:#2f3542;--muted:#57606f;--rule:#e4e8ee;
  --pen:#1e90ff;--pen-soft:rgba(30,144,255,.08);
  --ok:#1a9b52;--ok-soft:rgba(46,213,115,.12);
  --warn:#b26f00;--warn-soft:rgba(255,165,2,.12);
  --bad:#e8364a;--bad-soft:rgba(255,71,87,.10);
  --rainbow:linear-gradient(45deg,var(--red),var(--orange),var(--green),var(--blue),var(--purple));
  --display:"Cairo","Rubik",Tahoma,sans-serif;
  --body:"Cairo","Rubik",Tahoma,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(135deg,rgba(255,71,87,.05),rgba(255,165,2,.05),rgba(46,213,115,.05),rgba(30,144,255,.05))}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 60px;display:grid;gap:20px}
header{text-align:center;display:grid;justify-items:center;gap:6px}
.logo{width:150px;height:150px;border-radius:50%;padding:5px;background:var(--rainbow);box-shadow:0 10px 30px rgba(0,0,0,.12)}
.logo img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#0f1a3a;object-fit:contain}
.brand{font-weight:700;font-size:.9rem;color:var(--muted);letter-spacing:0}
header h1{font-family:var(--display);font-weight:900;font-size:2rem;line-height:1.3;margin:0;text-wrap:balance;background:linear-gradient(45deg,#ff4757,#1e90ff,#2ed573);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--blue)}
header p{margin:0;color:var(--muted);font-weight:500;max-width:62ch}
.progress{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.9rem;font-weight:600;font-variant-numeric:tabular-nums}
.bar{flex:1;height:8px;background:#fff;border-radius:99px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--rule)}
.bar i{display:block;height:100%;background:var(--rainbow);width:0;transition:width .4s;border-radius:99px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin;background:#fff;border-radius:30px;box-shadow:0 4px 15px rgba(0,0,0,.05);padding:6px}
.chip{flex:0 0 auto;border:0;background:none;color:#747d8c;border-radius:25px;padding:6px 14px;font:inherit;font-size:.85rem;font-weight:700;cursor:pointer;display:flex;gap:6px;align-items:center;transition:background-color .25s,color .25s}
.chip:hover{background:var(--pen-soft);color:var(--blue)}
.chip .n{font-variant-numeric:tabular-nums}
.chip.cur{background:linear-gradient(45deg,var(--blue),var(--teal));color:#fff;box-shadow:0 4px 12px rgba(30,144,255,.3)}
.chip.done:not(.cur){color:var(--ok)}
.chip.done .n::after{content:" ✓"}
.sheet{background:var(--sheet);border-radius:24px;padding:26px 22px 22px;display:grid;gap:16px;box-shadow:0 8px 20px rgba(0,0,0,.04);position:relative;overflow:hidden}
.sheet::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--rainbow)}
.sheet h2{font-family:var(--display);font-weight:800;font-size:1.35rem;margin:0;display:flex;gap:12px;align-items:center;text-wrap:balance}
.sheet h2 .num{flex:0 0 auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(45deg,var(--blue),var(--teal));color:#fff;font-size:1rem;font-variant-numeric:tabular-nums}
.lead{margin:0;color:var(--muted);font-weight:500}
.ai{border-radius:20px;padding:16px;display:grid;gap:10px;background:linear-gradient(#fbfdff,#fbfdff) padding-box,var(--rainbow) border-box;border:2px solid transparent}
.ai .tag{justify-self:start;font-size:.78rem;font-weight:700;color:var(--orange);background:rgba(255,165,2,.1);border-radius:30px;padding:2px 12px}
.ai ol{margin:0;padding-inline-start:20px}
textarea,input[type=text],input[type=number],input[type=email]{width:100%;font:inherit;color:var(--ink);background:#fff;border:2px solid var(--rule);border-radius:14px;padding:8px 12px;transition:border-color .2s}
textarea{min-height:110px;resize:vertical}
textarea[data-k="mapping"],textarea[data-k="grades"]{direction:ltr;text-align:left}
textarea.prompt{min-height:190px;font-size:.88rem;background:var(--paper)}
textarea:focus,input:focus{outline:none;border-color:var(--blue)}
button:focus-visible,a:focus-visible,input[type=checkbox]:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
label.f{display:grid;gap:4px;font-weight:700}
label.f small{font-weight:400;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.btn,a.btn{font:inherit;font-weight:700;border-radius:30px;padding:8px 20px;cursor:pointer;border:2px solid var(--blue);background:var(--blue);color:#fff;text-decoration:none;display:inline-block;box-shadow:0 4px 15px rgba(30,144,255,.2);transition:transform .2s,box-shadow .2s}
button.btn:hover,a.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(30,144,255,.3)}
button.ghost,a.ghost{background:#fff;color:var(--blue);box-shadow:0 4px 15px rgba(30,144,255,.1)}
button.plain{font:inherit;font-weight:700;border:2px solid var(--rule);background:#fff;color:var(--muted);border-radius:30px;padding:8px 20px;cursor:pointer}
button.plain:hover{border-color:var(--blue);color:var(--blue)}
.checks{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:6px 10px;border-radius:12px}
.checks label:hover{background:var(--pen-soft)}
.checks input{margin-top:6px;accent-color:var(--green);width:18px;height:18px;flex:0 0 auto}
.finish{border-top:2px dashed var(--rule);padding-top:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.finish label{display:flex;gap:8px;align-items:center;font-weight:700;cursor:pointer}
.finish input{accent-color:var(--green);width:20px;height:20px}
.note{border-radius:14px;padding:10px 14px;font-size:.92rem;font-weight:600}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.msg{font-size:.85rem;font-weight:600;color:var(--ok);min-height:1.2em}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.tile{border-radius:18px;padding:12px 14px;background:#fff;border:2px solid var(--rule);border-top-width:4px}
.tile:nth-child(5n+1){border-top-color:var(--red)}.tile:nth-child(5n+2){border-top-color:var(--orange)}.tile:nth-child(5n+3){border-top-color:var(--green)}.tile:nth-child(5n+4){border-top-color:var(--blue)}.tile:nth-child(5n+5){border-top-color:var(--purple)}
.tile b{display:block;font-weight:900;font-size:1.5rem;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:.85rem}
.hist{display:grid;gap:6px}
.hist .r{display:grid;grid-template-columns:76px 1fr 34px;gap:8px;align-items:center;font-size:.85rem;font-variant-numeric:tabular-nums}
.hist .t{height:14px;background:var(--paper);border-radius:99px;overflow:hidden}
.hist .t i{display:block;height:100%;border-radius:99px;background:linear-gradient(45deg,var(--blue),var(--teal))}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--rule);padding:6px 8px;text-align:start}
th{color:var(--muted);font-weight:600}
td.e{direction:ltr;unicode-bidi:isolate;text-align:start;word-break:break-all}
.st{font-size:.78rem;font-weight:700;border-radius:30px;padding:1px 10px}
.st.ok{background:var(--ok-soft);color:var(--ok)}
.st.bad{background:var(--bad-soft);color:var(--bad)}
.st.warn{background:var(--warn-soft);color:var(--warn)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;color:#8a94a3;font-size:.85rem}
.dialog{border-radius:18px;padding:14px;background:var(--bad-soft);color:var(--ink);display:none;gap:10px}
.dialog.on{display:grid}
.dialog .btn{background:var(--bad);border-color:var(--bad);box-shadow:none}
@media (max-width:420px){header h1{font-size:1.6rem}.logo{width:128px;height:128px}}
@media (prefers-reduced-motion:reduce){.bar i,button.btn,a.btn{transition:none}}

html[lang="he"]{--display:"Rubik",Arial,sans-serif;--body:"Rubik",Arial,"Segoe UI",sans-serif}
html[lang="en"]{--display:"Rubik","Cairo",sans-serif;--body:"Rubik","Cairo","Segoe UI",sans-serif}
.langs{display:inline-flex;gap:4px;background:#fff;border-radius:30px;padding:4px;box-shadow:0 4px 15px rgba(0,0,0,.05)}
.langs button{font:inherit;font-size:.85rem;font-weight:700;border:0;background:none;color:#747d8c;border-radius:25px;padding:5px 14px;cursor:pointer}
.langs button:hover{background:var(--pen-soft);color:var(--blue)}
.langs button.on{background:linear-gradient(45deg,var(--blue),var(--teal));color:#fff;box-shadow:0 4px 12px rgba(30,144,255,.3)}
.langs button[lang="ar"]{font-family:"Cairo",sans-serif}.langs button[lang="he"],.langs button[lang="en"]{font-family:"Rubik",sans-serif}
.topbar{display:flex;justify-content:center}
.howto{background:var(--paper);border-radius:18px;padding:12px 16px}
.howto ol{margin:6px 0 0;padding-inline-start:20px}
.mini{display:flex;gap:6px;flex-wrap:wrap}
.pill{font:inherit;font-size:.78rem;font-weight:700;border:2px solid var(--blue);background:#fff;color:var(--blue);border-radius:30px;padding:2px 10px;cursor:pointer}
.pill:hover{background:var(--blue);color:#fff}
tr.sentrow td{color:var(--muted);background:var(--ok-soft)}
td input[type=checkbox]{accent-color:var(--green);width:18px;height:18px}
.between{justify-content:space-between}
.counter{font-variant-numeric:tabular-nums}
.hint{margin:0;color:var(--muted);font-size:.85rem}
</style>
</head>

key:"השלב: יצירת מפתח בדיקה.\nצירפתי את קובץ המבחן הריק. צור מפתח בדיקה בטבלה עם העמודות הבאות:\nמספר שאלה | התשובה הנכונה | ניקוד לתשובה נכונה | קריטריונים לניקוד חלקי (מה מזכה בחלק מהניקוד וכמה) | תשובות חלופיות מקובלות.\n\nתנאים:\n- ודא שסכום הניקוד של השאלות שווה ל-{T}. אם הניקוד כתוב על המבחן, השתמש בו. אחרת הצע חלוקה וציין זאת.\n- אם שאלה עמומה או שיש לה יותר מתשובה אחת, ציין זאת מתחת לטבלה.\n- בסוף תן לי את הטבלה כטקסט רגיל שאפשר להעתיק.",
pilot:"השלב: בדיקת ניסיון.\nצירפתי קובץ PDF עם המבחנים הפתורים. על כל מבחן מופיע מספר בלבד, ללא שם. זה מפתח הבדיקה המאושר:\n\n{KEY}\n\nבדוק רק את שלושת המבחנים הראשונים לפי הכללים הבאים:\n{RULES}\n\nאחרי הבדיקה הצג לי את שלושת הקבצים וטבלה: מספר מבחן | ניקוד לכל שאלה | סך הכול. אחר כך עצור וחכה להערות שלי לפני שתמשיך.",
full:"השלב: בדיקה מלאה.\nצירפתי קובץ PDF עם המבחנים הפתורים. בדוק את המבחנים ממספר {F} עד מספר {TO}.\n\nמפתח הבדיקה המאושר:\n{KEY}\n{ADJ}\nכללי הבדיקה:\n{RULES}\n\nבסוף תן לי:\n1. קובץ PDF בדוק לכל מבחן, ששמו מספר המבחן בלבד (למשל 7.pdf).\n2. בלוק טקסט בדיוק בפורמט הזה, שורה לכל מבחן:\nמספר,ציון\n3. רשימת «לבדיקה»: מספר מבחן, מספר שאלה וסיבת הספק.",
adj:"\nתיקונים שסיכמנו אחרי בדיקת הניסיון (הקפד עליהם):\n{A}\n",
summary:"השלב: קובץ סיכום תוצאות הכיתה.\nאלה ציוני המבחנים אחרי הבדיקה:\n{G}\n\nעל סמך המבחנים שנבדקו בשיחה זו, צור קובץ סיכום (PDF) הכולל:\n1. טבלה: מספר מבחן | ציון | נקודות חוזק | נקודות חולשה (לכל מבחן, ללא שמות).\n2. נתוני הכיתה: ממוצע, הציון הגבוה והנמוך, התפלגות הציונים ואחוז ההצלחה בכל שאלה.\n3. השאלות והנושאים שרוב הכיתה טעתה בהם, עם הסבר אפשרי.\n4. מסקנות והמלצות מעשיות למורה על מצב הכיתה כולה ועל מה כדאי ללמד מחדש.\nהקובץ מיועד למורה בלבד.",
rules:"- המבחנים ממוספרים וללא שמות. אם בכל זאת מופיע שם על דף כלשהו, התעלם ממנו לחלוטין ואל תכתוב אותו בשום מקום.\n- סמן על גבי עמודי המבחן המקוריים בצבע אדום.\n- שים ✓ ליד תשובה נכונה ו-✗ ליד תשובה שגויה, וכתוב ליד כל שאלה את הניקוד שחושב (למשל 3/5).\n- בניקוד חלקי, כתוב הערה קצרה לתלמיד שמסבירה את הטעות ואת התיקון.\n- כתוב את הציון הכולל מתוך {T} בראש העמוד הראשון.\n- אם כתב היד לא קריא או שאינך בטוח בניקוד, סמן את השאלה «לבדיקה» ואל תנחש.\n- הקפד על מפתח הבדיקה ועל קריטריוני הניקוד החלקי במדויק.\n- כתוב את ההערות לתלמידים בשפת המבחן."}

/* ================= STATE ================= */
let S={lang:"",step:0,done:{},info:{subject:"",klass:"",title:"",total:"100",qcount:"",teacher:"",temail:""},checks:{},key:"",pilotNotes:"",bFrom:"",bTo:"",grades:"",flagged:"",mapping:"",message:null,sent:{}};
try{
  let raw=localStorage.getItem(KEY);
  if(raw){const o=JSON.parse(raw);S=Object.assign(S,o);S.info=Object.assign({subject:"",klass:"",title:"",total:"100",qcount:"",teacher:"",temail:""},o.info||{});}
  else{const old=localStorage.getItem("exam-grading-companion-v1");if(old){const o=JSON.parse(old);["key","pilotNotes","bFrom","bTo","grades","flagged","mapping"].forEach(k=>{if(o[k])S[k]=o[k];});if(o.info)S.info=Object.assign(S.info,o.info);}}
}catch(e){}
if(!T[S.lang]){const n=(navigator.language||"").slice(0,2);S.lang=T[n]?n:"ar";}
S.sent=S.sent||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const L=()=>T[S.lang];
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function g(path){return path.split(".").reduce((o,k)=>o==null?o:o[k],S);}
function sv(path,val){const ks=path.split(".");let o=S;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=val;save();}
const I=()=>S.info;
const or=(v,d)=>(v&&String(v).trim())?String(v).trim():d;
const fmt=(t,m)=>t.replace(/\{(\w+)\}/g,(x,k)=>k in m?m[k]:x);
const msgText=()=>S.message==null?L().defMsg:S.message;

/* ================= PARSING ================= */
function parseGrades(){const out=[];(S.grades||"").split(/\r?\n/).forEach(l=>{const m=l.match(/(\d+)\s*[,،\t; :|-]+\s*(\d+(?:[.,]\d+)?)/);if(m)out.push({n:m[1],g:parseFloat(m[2].replace(",","."))});});return out;}
function parseMap(){const out=[];(S.mapping||"").split(/\r?\n/).forEach(l=>{const n=l.match(/^\s*(\d+)/);const e=l.match(/[^\s,،;\t|]+@[^\s,،;\t|]+/);if(n||e||l.trim())if(n||e)out.push({n:n?n[1]:"",e:e?e[0].trim():""});});return out;}
const emailOk=e=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
function mapCheck(){
  const rows=parseMap(),grades=parseGrades(),p=L().p;
  const gset=new Set(grades.map(x=>x.n));const cN={},cE={};
  rows.forEach(r=>{if(r.n)cN[r.n]=(cN[r.n]||0)+1;if(r.e)cE[r.e.toLowerCase()]=(cE[r.e.toLowerCase()]||0)+1;});
  const res=rows.map(r=>{const q=[];
    if(!r.n)q.push(p.noNum);if(!r.e)q.push(p.noEmail);else if(!emailOk(r.e))q.push(p.badEmail);
    if(r.n&&cN[r.n]>1)q.push(p.dupNum);if(r.e&&cE[r.e.toLowerCase()]>1)q.push(p.dupEmail);
    return Object.assign({},r,{problems:q,warn:(gset.size&&r.n&&!gset.has(r.n))?p.noGrade:""});});
  const mset=new Set(rows.map(r=>r.n));
  return {res,good:res.filter(r=>!r.problems.length),missing:grades.filter(x=>!mset.has(x.n)).map(x=>x.n),bad:res.filter(r=>r.problems.length).length};
}

/* ================= PROMPTS ================= */
function head(){const P=L().P,ph=L().ph;return P.skill+"\n"+fmt(P.head,{s:or(I().subject,ph.subject),k:or(I().klass,ph.klass),t:or(I().title,ph.title),T:or(I().total,"100")})+(I().qcount?fmt(P.q,{q:I().qcount}):"");}
function rules(){return fmt(L().P.rules,{T:or(I().total,"100")});}
const PR={
key:()=>head()+"\n\n"+fmt(L().P.key,{T:or(I().total,"100")}),
pilot:()=>head()+"\n\n"+fmt(L().P.pilot,{KEY:or(S.key,L().ph.key),RULES:rules()}),
full:()=>head()+"\n\n"+fmt(L().P.full,{F:or(S.bFrom,L().ph.from),TO:or(S.bTo,L().ph.to),KEY:or(S.key,L().ph.key),ADJ:(S.pilotNotes&&S.pilotNotes.trim())?fmt(L().P.adj,{A:S.pilotNotes.trim()}):"",RULES:rules()}),
summary:()=>{const gr=parseGrades();return head()+"\n\n"+fmt(L().P.summary,{G:gr.length?gr.map(x=>x.n+","+x.g).join("\n"):L().ph.grades});}
};
function fillMsg(n){const ph=L().ph;return fmt(msgText(),{SUBJECT:or(I().subject,ph.subject),TITLE:or(I().title,ph.title),TEACHER:or(I().teacher,ph.teacher),NUM:n});}

const OPEN=()=>`<a class="btn ghost" href="https://claude.ai/new" target="_blank" rel="noopener">${L().openClaude}</a>`;
function aiBox(id,items){return `<div class="ai"><span class="tag">${L().aiTag}</span><ol>${items.map(x=>`<li>${x}</li>`).join("")}</ol><textarea class="prompt" id="p_${id}" readonly aria-label="${L().copyPrompt}"></textarea><div class="row"><button class="btn" type="button" data-copy="p_${id}" data-msg="m_${id}">${L().copyPrompt}</button>${OPEN()}</div><div class="msg" id="m_${id}" role="status"></div></div>`;}
function ck(id){return `<li><label><input type="checkbox" data-c="${id}"${S.checks[id]?" checked":""}><span>${L().c[id]}</span></label></li>`;}
function cks(ids){return `<ul class="checks">${ids.map(ck).join("")}</ul>`;}
function tx(path,label,hint){return `<label class="f">${label}${hint?`<small>${hint}</small>`:""}<textarea data-k="${path}" id="t_${path}">${esc(path==="message"?msgText():g(path))}</textarea></label>`;}
function inp(path,label,type,ph){return `<label class="f">${label}<input type="${type||"text"}" data-k="${path}" id="i_${path.replace(/\./g,"_")}" value="${esc(g(path))}" placeholder="${esc(ph||"")}"${type==="email"?' dir="ltr"':""}></label>`;}
function fi(k,type){const f=L().f[k];return inp("info."+k,f[0],type,f[1]);}

/* ================= RENDER ================= */
const strip=document.getElementById("strip"),stage=document.getElementById("stage");
function renderChrome(){
  const l=L();document.documentElement.lang=S.lang;document.documentElement.dir=l.dir;document.title=l.title;
  document.getElementById("h1").textContent=l.title;document.getElementById("brand").textContent=l.brand;document.getElementById("intro").textContent=l.intro;
  document.getElementById("localNote").textContent=l.local;document.getElementById("wipeBtn").textContent=l.wipe;document.getElementById("wipeQ").textContent=l.wipeQ;
  document.getElementById("wipeYes").textContent=l.wipeYes;document.getElementById("wipeNo").textContent=l.cancel;
  const ls=document.getElementById("langs");ls.setAttribute("aria-label",l.langLabel);
  ls.innerHTML=Object.keys(T).map(k=>`<button type="button" lang="${k}" data-lang="${k}" class="${k===S.lang?"on":""}" aria-pressed="${k===S.lang}">${T[k].name}</button>`).join("");
}
function renderStrip(){
  const l=L();
  strip.innerHTML=l.steps.map((s,i)=>`<button type="button" class="chip${i===S.step?" cur":""}${S.done[i]?" done":""}" data-go="${i}"${i===S.step?' aria-current="step"':""}><span class="n">${i+1}</span>${s.s}</button>`).join("");
  const d=l.steps.filter((_,i)=>S.done[i]).length;
  document.getElementById("progTxt").textContent=fmt(l.progress,{d,n:l.steps.length});
  document.getElementById("progBar").style.width=(d/l.steps.length*100)+"%";
  const cur=strip.querySelector(".cur");if(cur&&cur.scrollIntoView)try{cur.scrollIntoView({block:"nearest",inline:"nearest"});}catch(e){}
}
function render(){
  renderChrome();
  const i=S.step,l=L();
  stage.innerHTML=`<section class="sheet" aria-labelledby="h"><h2 id="h"><span class="num">${i+1}</span>${l.steps[i].t}</h2>${BODY[i]()}
  <div class="finish"><label><input type="checkbox" id="doneBox"${S.done[i]?" checked":""}>${l.done}</label>
  <div class="row">${i>0?`<button class="plain" type="button" data-go="${i-1}">${l.prev}</button>`:""}${i<l.steps.length-1?`<button class="btn" type="button" data-go="${i+1}">${l.next}</button>`:""}</div></div></section>`;
  renderStrip();refresh();
}
function refresh(){
  Object.keys(PR).forEach(id=>{const el=document.getElementById("p_"+id);if(el)el.value=PR[id]();});
  const gs=document.getElementById("gradeStats"),ss=document.getElementById("sumStats");
  if(gs)gs.innerHTML=statsHTML(false);if(ss)ss.innerHTML=statsHTML(true);
  const mo=document.getElementById("mapOut");if(mo)mo.innerHTML=mapHTML();
  const pv=document.getElementById("preview");if(pv)pv.value=fillMsg("7");
  const sg=document.getElementById("sendGate");if(sg)sg.innerHTML=gateHTML();
  const st=document.getElementById("sendTable");if(st)st.innerHTML=sendHTML();
}
function statsHTML(full){
  const l=L(),gr=parseGrades();if(!gr.length)return full?`<div class="note warn">${l.noGrades}</div>`:"";
  const T0=parseFloat(I().total)||100,v=gr.map(x=>x.g),n=v.length,avg=v.reduce((a,b)=>a+b,0)/n,pass=v.filter(x=>x/T0*100>=55).length;
  const dup=gr.length-new Set(gr.map(x=>x.n)).size,over=gr.filter(x=>x.g>T0).length;
  let h=`<div class="tiles"><div class="tile"><b>${n}</b><span>${l.tile.exams}</span></div><div class="tile"><b>${avg.toFixed(1)}</b><span>${fmt(l.tile.avg,{T:T0})}</span></div><div class="tile"><b>${Math.max(...v)}</b><span>${l.tile.max}</span></div><div class="tile"><b>${Math.min(...v)}</b><span>${l.tile.min}</span></div><div class="tile"><b>${Math.round(pass/n*100)}%</b><span>${l.tile.pass}</span></div></div>`;
  if(dup||over)h+=`<div class="note bad">${dup?fmt(l.dup,{n:dup})+" ":""}${over?fmt(l.over,{n:over}):""}</div>`;
  if(full){
    const B=[[0,55,l.lt55],[55,65,"55–64"],[65,75,"65–74"],[75,85,"75–84"],[85,95,"85–94"],[95,101,"95–100"]];
    const c=B.map(b=>v.filter(x=>{const p=x/T0*100;return p>=b[0]&&p<b[1];}).length),m=Math.max(1,...c);
    h+=`<div class="hist" role="img" aria-label="${l.histAria}">`+B.map((b,k)=>`<div class="r"><span>${b[2]}</span><div class="t"><i style="width:${c[k]/m*100}%"></i></div><span>${c[k]}</span></div>`).join("")+`</div>`;
  }
  return h;
}
function mapHTML(){
  const l=L(),{res,missing,bad}=mapCheck();if(!res.length)return "";
  let h=bad?`<div class="note bad">${fmt(l.rowsBad,{n:bad})}</div>`:`<div class="note ok">${fmt(l.allOk,{n:res.length})}</div>`;
  if(missing.length)h+=`<div class="note warn">${fmt(l.missing,{list:missing.join(", ")})}</div>`;
  h+=`<div class="tbl"><table><thead><tr><th>${l.col.num}</th><th>${l.col.email}</th><th>${l.col.status}</th></tr></thead><tbody>`+res.map(r=>`<tr><td>${esc(r.n)}</td><td class="e">${esc(r.e)}</td><td>${r.problems.length?`<span class="st bad">${r.problems.join(", ")}</span>`:r.warn?`<span class="st warn">${r.warn}</span>`:`<span class="st ok">${l.okTag}</span>`}</td></tr>`).join("")+`</tbody></table></div>`;
  return h;
}
function gateList(){
  const l=L(),p=[];
  if(!S.checks.policy||!S.checks.orgAcct)p.push(l.gate.approval);
  if(!emailOk(I().temail||""))p.push(l.gate.temail);
  if(!S.done[6])p.push(l.gate.review);
  if(!S.checks.drRestr)p.push(l.gate.restr);
  const m=mapCheck();if(!m.res.length)p.push(l.gate.map);else if(m.bad)p.push(l.gate.mapFix);
  return p;
}
function gateHTML(){const p=gateList(),l=L();return p.length?`<div class="note bad">${fmt(l.gateMissing,{list:p.join(", ")})}</div>`:`<div class="note ok">${l.gateReady}</div>`;}
function sendHTML(){
  const l=L();if(gateList().length||!S.checks.testOk)return `<div class="note warn">${l.locked}</div>`;
  const rows=mapCheck().good,d=rows.filter(r=>S.sent[r.n]).length;
  let h=`<div class="row between"><b class="counter">${fmt(l.counter,{d,n:rows.length})}</b><button class="plain" type="button" data-csv="1">${l.csv}</button></div><div class="msg" id="m_csv" role="status"></div>
  <div class="tbl"><table><thead><tr><th>${l.col.num}</th><th>${l.col.email}</th><th>${l.col.act}</th><th>${l.col.sent}</th></tr></thead><tbody>`+
  rows.map(r=>`<tr class="${S.sent[r.n]?"sentrow":""}"><td>${esc(r.n)}</td><td class="e">${esc(r.e)}</td><td><div class="mini"><button type="button" class="pill" data-ce="${esc(r.n)}">${l.copyEmail}</button><button type="button" class="pill" data-cm="${esc(r.n)}">${l.copyMsg}</button></div></td><td><input type="checkbox" aria-label="${l.col.sent} ${esc(r.n)}" data-sent="${esc(r.n)}"${S.sent[r.n]?" checked":""}></td></tr>`).join("")+`</tbody></table></div>
  <p class="hint">${l.csvHint}</p>`;
  if(rows.length&&d===rows.length)h+=`<div class="note ok">${l.finished}</div>`;
  return h;
}

/* ================= EVENTS ================= */
function copy(text,msgEl,ta){
  const l=L(),ok=()=>{if(msgEl){msgEl.textContent=l.copied;setTimeout(()=>{msgEl.textContent="";},2500);}};
  const fb=()=>{if(ta){ta.focus();ta.select();try{if(document.execCommand("copy")){ok();return;}}catch(_){}}if(msgEl)msgEl.textContent=l.copyManual;};
  try{navigator.clipboard.writeText(text).then(ok,fb);}catch(_){fb();}
}
function flash(btn){const o=btn.textContent;btn.textContent="✓";setTimeout(()=>{btn.textContent=o;},1200);}
document.addEventListener("click",e=>{
  const t=e.target;
  const lg=t.closest("[data-lang]");if(lg){S.lang=lg.dataset.lang;save();render();return;}
  const go=t.closest("[data-go]");if(go){S.step=+go.dataset.go;save();render();try{window.scrollTo({top:0});}catch(_){}return;}
  const cp=t.closest("[data-copy]");if(cp){const ta=document.getElementById(cp.dataset.copy);copy(ta.value,document.getElementById(cp.dataset.msg),ta);return;}
  const ce=t.closest("[data-ce]");if(ce){const r=mapCheck().good.find(x=>x.n===ce.dataset.ce);if(r){copy(r.e);flash(ce);}return;}
  const cm=t.closest("[data-cm]");if(cm){copy(fillMsg(cm.dataset.cm));flash(cm);return;}
  if(t.closest("[data-csv]")){const rows=mapCheck().good;const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
    copy(["number,email,message"].concat(rows.map(r=>[r.n,r.e,fillMsg(r.n)].map(q).join(","))).join("\n"),document.getElementById("m_csv"));return;}
  if(t.id==="resetMsg"){S.message=null;save();render();return;}
  if(t.id==="wipeBtn")document.getElementById("wipeDlg").classList.add("on");
  if(t.id==="wipeNo")document.getElementById("wipeDlg").classList.remove("on");
  if(t.id==="wipeYes"){try{localStorage.removeItem(KEY);localStorage.removeItem("exam-grading-companion-v1");}catch(_){}location.reload();}
});
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){sv(k,e.target.value);refresh();}});
document.addEventListener("change",e=>{
  const d=e.target.dataset||{};
  if(d.c){S.checks[d.c]=e.target.checked;save();refresh();}
  if(d.sent){S.sent[d.sent]=e.target.checked;save();refresh();}
  if(e.target.id==="doneBox"){S.done[S.step]=e.target.checked;save();renderStrip();refresh();}
});
render();
})();

</script>
</body>
